            <a href="https://www.instagram.com/viticolturaerotica/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs text-[#6E635B] hover:text-[#2C2623] font-medium tracking-wide transition active:scale-95">
                <span>powered by viticolturaerotica</span>
                <img src="https://i.ibb.co/XrYGdthZ/icona.png" alt="Viticoltura Erotica" class="w-4 h-4 object-contain rounded-full shadow-xs">
            </a>
        </div>
        
        <div id="status-loading" class="text-xs text-[#8C5830] mt-2 font-medium hidden">Caricamento in corso...</div>
    </header>

    <section id="filter-section" class="mb-8">
        <!-- Tasti Tipologia -->
        <div class="flex flex-wrap items-center justify-center gap-1.5 py-1">
            <button onclick="filterType('Tutti', this)" class="cat-btn px-3.5 py-2 sm:py-1.5 bg-[#2C2623] text-[#FBF9F5] rounded-full text-[11px] font-bold uppercase tracking-wider shadow-sm cursor-pointer transition">Tutti</button>
            <button onclick="filterType('rosso', this)" class="cat-btn px-3.5 py-2 sm:py-1.5 bg-[#EFE9DF] text-[#2C2623] hover:bg-[#E2D8C9] rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-[#E2D8C9] cursor-pointer">Rossi</button>
            <button onclick="filterType('bolle', this)" class="cat-btn px-3.5 py-2 sm:py-1.5 bg-[#EFE9DF] text-[#2C2623] hover:bg-[#E2D8C9] rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-[#E2D8C9] cursor-pointer">Bolle</button>
            <button onclick="filterType('bianco', this)" class="cat-btn px-3.5 py-2 sm:py-1.5 bg-[#EFE9DF] text-[#2C2623] hover:bg-[#E2D8C9] rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-[#E2D8C9] cursor-pointer">Bianchi</button>
            <button onclick="filterType('rosa', this)" class="cat-btn px-3.5 py-2 sm:py-1.5 bg-[#EFE9DF] text-[#2C2623] hover:bg-[#E2D8C9] rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-[#E2D8C9] cursor-pointer">Rosa</button>
        </div>
    </section>

    <main id="item-list" class="grid grid-cols-1 md:grid-cols-2 gap-5">
    </main>

    <div id="item-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs hidden z-50 items-center justify-center p-4" onclick="closeModal()">
        <div class="bg-[#2C2623] text-[#FBF9F5] p-6 md:p-8 rounded-3xl max-w-lg w-full border border-[#443B35] shadow-2xl relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-[#A89F95] hover:text-white text-2xl font-sans">&times;</button>
            <div id="modal-badge-container" class="flex flex-wrap gap-1"></div>
            
            <h3 id="modal-item-title" class="serif-title text-4xl text-[#E8C4A0] mt-3 font-normal leading-tight"></h3>
            <p id="modal-item-subtitle" class="text-[#D1C8BE] text-base mt-1 font-medium"></p>
            <p id="modal-item-extra" class="text-[#B8AEA3] text-xs mt-1.5 font-medium flex items-center gap-1"></p>
            
            <div class="border-t border-[#443B35] my-4 pt-4 space-y-2 text-sm text-[#D1C8BE]">
                <p id="modal-item-geo"></p>
                <div class="flex justify-between items-center pt-1">
                    <span id="modal-price-label" class="text-[#A89F95] text-xs uppercase tracking-wider font-bold">Prezzo</span>
                    <p id="modal-item-price" class="text-[#E8C4A0] font-bold text-xl font-sans"></p>
                </div>
            </div>
            <div id="modal-desc-box" class="bg-[#38302C] p-4 rounded-xl border border-[#4E433D] mt-4 hidden">
                <h4 id="modal-desc-title" class="text-xs uppercase tracking-wider text-[#D9A06C] font-bold mb-2 font-sans">Nota</h4>
                <p id="modal-item-desc" class="serif-title text-xl text-[#F2ECE4] leading-relaxed italic"></p>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/19mO8dALvXX2u4d-JZNm0zgKTIIi3AF5CuOKpZiAcEr0/edit?usp=sharing";
        
        let wines = [];
        let beers = [];
        let spirits = [];

        let currentView = 'carta';
        let currentFilter = 'Tutti';
        let isLoadedCount = 0;

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function parsePrice(val) {
            if (val === undefined || val === null || val === '') return 0;
            if (typeof val === 'number') return val;
            let str = String(val).replace(',', '.').replace(/[^0-9.-]+/g, "");
            let num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        window.googleDocCallback = function(data) { handleSheetResponse(data, 'wines'); };
        window.beerCallback = function(data) { handleSheetResponse(data, 'beers'); };
        window.spiritCallback = function(data) { handleSheetResponse(data, 'spirits'); };

        function handleSheetResponse(data, type) {
            isLoadedCount++;
            const statusEl = document.getElementById('status-loading');
            try {
                if (!data || !data.table || !data.table.rows) return;
                const rows = data.table.rows;
                const cols = data.table.cols.map(c => c.label ? c.label.toLowerCase().trim() : '');

                if (type === 'wines') {
                    if (!cols.includes('nome')) return;
                    const validRows = rows.filter(row => row && row.c && row.c[cols.indexOf('nome')] && row.c[cols.indexOf('nome')].v);
                    wines = shuffleArray(validRows.map(row => {
                        const obj = {};
                        row.c.forEach((cell, i) => { if (cols[i]) obj[cols[i]] = cell ? cell.v : ''; });
                        const checkBool = (val) => val !== undefined && val !== null && String(val).toUpperCase().trim() === 'TRUE';
                        return {
                            cantina: obj.cantina ? String(obj.cantina).trim() : '',
                            nome: obj.nome ? String(obj.nome).trim() : '',
                            tipo: obj.tipo ? String(obj.tipo).toLowerCase().trim() : '',
                            regione: obj.regione ? String(obj.regione).trim() : '',
                            zona: obj.zona ? String(obj.zona).trim() : '',
                            uve: obj.uve ? String(obj.uve).trim() : '',
                            anno: obj.anno ? parseInt(obj.anno) : '',
                            prezzo: parsePrice(obj.prezzo),
                            prezzoBicchiere: parsePrice(obj.bicchiere),
                            disponibile: obj.disponibile !== undefined ? checkBool(obj.disponibile) : true,
                            doc: obj.doc ? String(obj.doc).trim() : '',
                            descrizione: obj.descrizione ? String(obj.descrizione).trim() : '',
                            sottotipo: obj.sottotipo ? String(obj.sottotipo).trim() : '',
                        };
                    }));
                } else if (type === 'beers') {
                    if (!cols.includes('nome')) return;
                    const validRows = rows.filter(row => row && row.c && row.c[cols.indexOf('nome')] && row.c[cols.indexOf('nome')].v);
                    beers = validRows.map(row => {
                        const obj = {};
                        row.c.forEach((cell, i) => { if (cols[i]) obj[cols[i]] = cell ? cell.v : ''; });
                        return {
                            birrificio: obj.birrificio ? String(obj.birrificio).trim() : '',
                            nome: obj.nome ? String(obj.nome).trim() : '',
                            tipologia: obj.tipologia ? String(obj.tipologia).trim() : '',
                            volume: obj.volume ? String(obj.volume).trim() : '',
                            alcol: obj.alcol ? String(obj.alcol).trim() : '',
                            prezzo: parsePrice(obj.prezzo),
                            descrizione: obj.descrizione ? String(obj.descrizione).trim() : ''
                        };
                    });
                } else if (type === 'spirits') {
                    if (!cols.includes('nome')) return;
                    const validRows = rows.filter(row => row && row.c && row.c[cols.indexOf('nome')] && row.c[cols.indexOf('nome')].v);
                    spirits = validRows.map(row => {
                        const obj = {};
                        row.c.forEach((cell, i) => { if (cols[i]) obj[cols[i]] = cell ? cell.v : ''; });
                        return {
                            categoria: obj.categoria ? String(obj.categoria).trim() : '',
                            nome: obj.nome ? String(obj.nome).trim() : '',
                            prezzo: parsePrice(obj.prezzo),
                            regione: obj.regione ? String(obj.regione).trim() : ''
                        };
                    });
                }

                if (isLoadedCount >= 1) {
                    statusEl.classList.add('hidden');
                    renderItems();
                }
            } catch (error) {
                console.error(error);
            }
        }

        function loadDataViaJSONP() {
            const statusEl = document.getElementById('status-loading');
            const matches = GOOGLE_SHEET_URL.match(/\/d\/([^/]+)/);
            if (!matches || !matches[1]) return;
            const sheetId = matches[1];

            const script1 = document.createElement('script');
            script1.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:googleDocCallback&t=${Date.now()}`;
            document.body.appendChild(script1);

            const script2 = document.createElement('script');
            script2.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=Birre&tqx=responseHandler:beerCallback&t=${Date.now()}`;
            document.body.appendChild(script2);

            const script3 = document.createElement('script');
            script3.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=Superalcolici&tqx=responseHandler:spiritCallback&t=${Date.now()}`;
            document.body.appendChild(script3);
        }

        function switchView(view) {
            currentView = view;
            const tabs = ['carta', 'mescita', 'birre', 'superalcolici'];
            tabs.forEach(t => {
                const el = document.getElementById('tab-' + t);
                if (t === view) {
                    el.className = "px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition cursor-pointer bg-[#2C2623] text-[#FBF9F5] shadow-sm";
                } else {
                    el.className = "px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition cursor-pointer text-[#2C2623] hover:bg-[#E2D8C9]/60";
                }
            });

            const filterSection = document.getElementById('filter-section');
            if (view === 'carta' || view === 'mescita') {
                filterSection.style.display = 'block';
                currentFilter = 'Tutti';
            } else {
                filterSection.style.display = 'none';
            }
            renderItems();
        }

        function filterType(type, element) {
            currentFilter = type;
            updateButtonStyles(element);
            renderItems();
        }

        function updateButtonStyles(element) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-3.5 py-2 sm:py-1.5 bg-[#EFE9DF] text-[#2C2623] hover:bg-[#E2D8C9] rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-[#E2D8C9] cursor-pointer";
            });
            if (element) {
                element.className = "cat-btn px-3.5 py-2 sm:py-1.5 bg-[#2C2623] text-[#FBF9F5] rounded-full text-[11px] font-bold uppercase tracking-wider shadow-sm cursor-pointer";
            }
        }

        function openModal(index, type) {
            let item;
            if (type === 'wine') {
                item = wines[index];
                if (!item) return;
                const docBadge = item.doc ? `<span class="text-[10px] font-sans font-bold tracking-wider bg-[#3C3531] text-[#D1C8BE] px-1.5 py-0.5 rounded border border-[#4F4540] ml-2 uppercase">${item.doc}</span>` : '';
                let labels = [];
                if (item.sottotipo) labels.push(item.sottotipo);
                if (currentView === 'mescita' || item.prezzoBicchiere > 0) labels.push('In Mescita');
                
                document.getElementById('modal-badge-container').innerHTML = labels.map(l => `<span class="text-[9px] font-medium px-2 py-0.5 rounded-full uppercase tracking-wider bg-[#38302C] text-[#E8C4A0] border border-[#4E433D]">${l}</span>`).join('') + docBadge;
                document.getElementById('modal-item-title').innerText = item.cantina;
                document.getElementById('modal-item-subtitle').innerHTML = `${item.nome} <span class="text-sm font-sans text-[#A89F95] ml-1 font-normal">${item.anno || ''}</span>`;
                document.getElementById('modal-item-extra').innerHTML = `🍇 Uve: <span class="text-[#FBF9F5] font-sans font-normal">${item.uve || 'N/D'}</span>`;
                document.getElementById('modal-item-geo').innerHTML = `📍 Denominazione: <b>${item.zona || 'N/D'}</b> &bull; Regione: <b>${item.regione || 'N/D'}</b>`;
                
                const isMescitaView = currentView === 'mescita';
                document.getElementById('modal-price-label').innerText = isMescitaView ? 'Prezzo Calice' : 'Prezzo Bottiglia';
                const activePrice = isMescitaView ? item.prezzoBicchiere : item.prezzo;
                document.getElementById('modal-item-price').innerText = `${activePrice ? activePrice.toFixed(2) : '0.00'} €`;
                
                const descBox = document.getElementById('modal-desc-box');
                if (item.descrizione && item.descrizione.length > 0) {
                    document.getElementById('modal-desc-title').innerText = "Nota di Degustazione";
                    document.getElementById('modal-item-desc').innerText = item.descrizione;
                    descBox.classList.remove('hidden');
                } else {
                    descBox.classList.add('hidden');
                }
            } else if (type === 'beer') {
                item = beers[index];
                if (!item) return;
                document.getElementById('modal-badge-container').innerHTML = `<span class="text-[9px] font-medium px-2 py-0.5 rounded-full uppercase tracking-wider bg-[#38302C] text-[#E8C4A0] border border-[#4E433D]">${item.tipologia || 'Birra'}</span>`;
                document.getElementById('modal-item-title').innerText = item.birrificio;
                document.getElementById('modal-item-subtitle').innerHTML = `${item.nome} <span class="text-sm font-sans text-[#A89F95] ml-1 font-normal">${item.volume || ''} &bull; ${item.alcol || ''}</span>`;
                document.getElementById('modal-item-extra').innerHTML = `🍺 Tipologia: <span class="text-[#FBF9F5] font-sans font-normal">${item.tipologia || 'N/D'}</span>`;
                document.getElementById('modal-item-geo').innerHTML = `📦 Formato: <b>${item.volume || 'N/D'}</b> &bull; Gradazione: <b>${item.alcol || 'N/D'}</b>`;
                document.getElementById('modal-price-label').innerText = 'Prezzo';
                document.getElementById('modal-item-price').innerText = `${item.prezzo ? item.prezzo.toFixed(2) : '0.00'} €`;

                const descBox = document.getElementById('modal-desc-box');
                if (item.descrizione && item.descrizione.length > 0) {
                    document.getElementById('modal-desc-title').innerText = "Descrizione Birra";
                    document.getElementById('modal-item-desc').innerText = item.descrizione;
                    descBox.classList.remove('hidden');
                } else {
                    descBox.classList.add('hidden');
                }
            } else if (type === 'spirit') {
                item = spirits[index];
                if (!item) return;
                document.getElementById('modal-badge-container').innerHTML = `<span class="text-[9px] font-medium px-2 py-0.5 rounded-full uppercase tracking-wider bg-[#38302C] text-[#E8C4A0] border border-[#4E433D]">${item.categoria || 'Superalcolico'}</span>`;
                document.getElementById('modal-item-title').innerText = item.nome;
                document.getElementById('modal-item-subtitle').innerHTML = `${item.categoria || ''}`;
                document.getElementById('modal-item-extra').innerHTML = `📍 Regione/Provenienza: <span class="text-[#FBF9F5] font-sans font-normal">${item.regione || 'N/D'}</span>`;
                document.getElementById('modal-item-geo').innerHTML = `📍 Provenienza: <b>${item.regione || 'N/D'}</b>`;
                document.getElementById('modal-price-label').innerText = 'Prezzo';
                document.getElementById('modal-item-price').innerText = `${item.prezzo ? item.prezzo.toFixed(2) : '0.00'} €`;
                document.getElementById('modal-desc-box').classList.add('hidden');
            }
            document.getElementById('item-modal').classList.replace('hidden', 'flex');
        }

        function closeModal() { document.getElementById('item-modal').classList.replace('flex', 'hidden'); }

        function renderItems() {
            const container = document.getElementById('item-list');
            container.innerHTML = '';

            if (currentView === 'birre') {
                if (beers.length === 0) {
                    container.innerHTML = `<p class="col-span-full text-center text-[#6E635B] py-12 italic text-sm">Nessuna birra disponibile.</p>`;
                    return;
                }
                beers.forEach((b, index) => {
                    const descBlock = b.descrizione && b.descrizione.length > 0 ? `<div class="mt-3 pt-2.5 border-t border-[#EAE3D8]"><p class="serif-title text-base text-[#524943] italic leading-relaxed">${b.descrizione}</p></div>` : '';
                    container.innerHTML += `
                        <div onclick="openModal(${index}, 'beer')" class="bg-white p-5 rounded-2xl border border-[#E2D8C9] shadow-xs card-hover flex flex-col justify-between cursor-pointer">
                            <div>
                                <div class="flex justify-between items-start gap-2">
                                    <span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider bg-[#5C3A21] text-[#F9EFE6]">${b.tipologia || 'Birra'}</span>
                                    <span class="text-[#2C2623] font-bold font-sans">${b.prezzo ? b.prezzo.toFixed(2) : '0.00'} €</span>
                                </div>
                                <h3 class="serif-title text-3xl text-[#2C2623] mt-2.5 font-normal leading-tight">${b.birrificio}</h3>
                                <p class="text-[#524943] text-base mt-0.5 font-semibold flex items-center flex-wrap">
                                    ${b.nome} <span class="text-xs font-sans text-[#8C8075] ml-2 font-normal">${b.volume || ''} &bull; ${b.alcol || ''}</span>
                                </p>
                                <p class="text-[#6E635B] text-xs mt-1.5 font-medium flex items-center gap-1">
                                    🍺 Tipologia: <span class="font-normal text-[#2C2623]">${b.tipologia || 'N/D'}</span>
                                </p>
                                ${descBlock}
                            </div>
                        </div>
                    `;
                });
                return;
            }

            if (currentView === 'superalcolici') {
                if (spirits.length === 0) {
                    container.innerHTML = `<p class="col-span-full text-center text-[#6E635B] py-12 italic text-sm">Nessun superalcolico disponibile.</p>`;
                    return;
                }
                spirits.forEach((s, index) => {
                    container.innerHTML += `
                        <div onclick="openModal(${index}, 'spirit')" class="bg-white p-5 rounded-2xl border border-[#E2D8C9] shadow-xs card-hover flex flex-col justify-between cursor-pointer">
                            <div>
                                <div class="flex justify-between items-start gap-2">
                                    <span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider bg-[#38302C] text-[#E8C4A0]">${s.categoria || 'Superalcolico'}</span>
                                    <span class="text-[#2C2623] font-bold font-sans">${s.prezzo ? s.prezzo.toFixed(2) : '0.00'} €</span>
                                </div>
                                <h3 class="serif-title text-3xl text-[#2C2623] mt-2.5 font-normal leading-tight">${s.nome}</h3>
                                <p class="text-[#524943] text-base mt-0.5 font-semibold">${s.categoria || ''}</p>
                                <p class="text-[#6E635B] text-xs mt-2 flex items-center gap-1 font-medium">📍 ${s.regione || 'N/D'}</p>
                            </div>
                        </div>
                    `;
                });
                return;
            }

            let filtered = wines.map((w, index) => ({...w, originalIndex: index})).filter(w => {
                if (!w.disponibile) return false;
                if (currentView === 'mescita' && w.prezzoBicchiere <= 0) return false;

                let matchesFilter = false;
                const activeFilterLower = currentFilter.toLowerCase().trim();
                const wineTipoLower = w.tipo ? w.tipo.toLowerCase().trim() : '';
                
                if (activeFilterLower === 'tutti') { 
                    matchesFilter = true; 
                } else if (activeFilterLower === 'champagne') {
                    matchesFilter = w.champagne === true || wineTipoLower === 'champagne';
                } else { 
                    matchesFilter = wineTipoLower === activeFilterLower; 
                }
                return matchesFilter;
            });

            if (currentView === 'mescita') {
                const orderMap = { 'franciacorta': 1, 'altre bolle': 2, 'champagne': 3, 'bolle': 2, 'bianco': 4, 'rosso': 5, 'rosa': 6, 'arancione': 7 };
                filtered.sort((a, b) => {
                    const typeA = a.tipo ? a.tipo.toLowerCase().trim() : '';
                    const typeB = b.tipo ? b.tipo.toLowerCase().trim() : '';
                    return (orderMap[typeA] || 99) - (orderMap[typeB] || 99);
                });
            }

            if(filtered.length === 0) {
                const emptyMsg = currentView === 'mescita' ? "Nessun vino in mescita rispecchia i filtri selezionati." : "Nessun vino rispecchia i filtri selezionati.";
                container.innerHTML = `<p class="col-span-full text-center text-[#6E635B] py-12 italic text-sm">${emptyMsg}</p>`;
                return;
            }

            filtered.forEach(w => {
                let badgeLabel = w.sottotipo || 'Vino';
                let badgeColor = 'bg-[#38302C] text-[#E8C4A0]';
                const tipoCheck = w.sottotipo ? w.sottotipo.toLowerCase().trim() : '';

                if (tipoCheck === 'rosso') { badgeColor = 'bg-[#612820] text-[#FBEBE8]'; }
                else if (tipoCheck === 'bianco') { badgeColor = 'bg-[#5C4521] text-[#FBF3E8]'; }
                else if (tipoCheck === 'bolle' || tipoCheck === 'franciacorta') { badgeColor = 'bg-[#8C6D30] text-[#FFF8ED] font-bold'; }
                else if (tipoCheck === 'altre bolle') { badgeColor = 'bg-[#4A4540] text-[#EFEAE2]'; }
                else if (tipoCheck === 'arancione') { badgeColor = 'bg-[#854320] text-[#FCEEE6]'; }
                else if (tipoCheck === 'rosa') { badgeColor = 'bg-[#823B52] text-[#FCEFF3]'; }

                const docBadge = w.doc ? `<span class="text-[10px] font-sans font-bold tracking-wider bg-[#EFE9DF] text-[#524943] px-1.5 py-0.5 rounded border border-[#E2D8C9] ml-2 uppercase">${w.doc}</span>` : '';
                const geoString = w.zona ? `${w.zona} &bull; ${w.regione}` : w.regione;
                const displayPrice = currentView === 'mescita' ? w.prezzoBicchiere : w.prezzo;
                const priceLabelSuffix = currentView === 'mescita' ? ' € <span class="text-[11px] font-medium text-[#6E635B]">calice</span>' : ' €';
                const descBlock = w.descrizione && w.descrizione.length > 0 ? `<div class="mt-3 pt-2.5 border-t border-[#EAE3D8]"><p class="serif-title text-base text-[#524943] italic leading-relaxed">${w.descrizione}</p></div>` : '';

                container.innerHTML += `
                    <div onclick="openModal(${w.originalIndex}, 'wine')" class="bg-white p-5 rounded-2xl border border-[#E2D8C9] shadow-xs card-hover flex flex-col justify-between cursor-pointer">
                        <div>
                            <div class="flex justify-between items-start gap-2">
                                <span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider ${badgeColor}">${badgeLabel}</span>
                                <span class="text-[#2C2623] font-bold font-sans">${displayPrice ? displayPrice.toFixed(2) : '0.00'}${priceLabelSuffix}</span>
                            </div>
                            
                            <h3 class="serif-title text-3xl text-[#2C2623] mt-2.5 font-normal leading-tight">
                                ${w.cantina}
                            </h3>
                            
                            <p class="text-[#524943] text-base mt-0.5 font-semibold flex items-center flex-wrap">
                                ${w.nome} 
                                <span class="text-xs font-sans text-[#8C8075] ml-2 font-normal">${w.anno || ''}</span>
                                ${docBadge}
                            </p>
                            
                            <p class="text-[#6E635B] text-xs mt-1.5 font-medium flex items-center gap-1">
                                🍇 Uve: <span class="font-normal text-[#2C2623]">${w.uve || 'N/D'}</span>
                            </p>
                            
                            <p class="text-[#8C8075] text-xs mt-2 flex items-center gap-1 font-medium">📍 ${geoString}</p>
                            
                            ${descBlock}
                        </div>
                    </div>
                `;
            });
        }

        loadDataViaJSONP();
    </script>
</body>
</html>
